<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A.K. Gopalan v. State of Madras (1950)</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#111; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #deck { width:100vw; height:100vh; position:relative; }
  .slide {
    position:absolute; inset:0; display:none;
    align-items:center; justify-content:center;
    background:#111;
  }
  .slide.active { display:flex; }
  .slide img {
    width:100%; height:100%; object-fit:contain;
    user-select:none; -webkit-user-drag:none;
  }
  .nav {
    position:fixed; z-index:10; top:50%; transform:translateY(-50%);
    border:0; width:52px; height:70px; border-radius:12px;
    background:rgba(0,0,0,.48); color:white; font-size:34px;
    cursor:pointer; opacity:.45; transition:.2s;
  }
  .nav:hover { opacity:.9; background:rgba(0,0,0,.72); }
  #prev { left:18px; } #next { right:18px; }
  #counter {
    position:fixed; z-index:10; left:50%; bottom:18px;
    transform:translateX(-50%); color:white;
    background:rgba(0,0,0,.55); padding:7px 13px; border-radius:999px;
    font-size:14px; backdrop-filter:blur(6px);
  }
  #hint {
    position:fixed; z-index:10; left:50%; top:18px;
    transform:translateX(-50%); color:white;
    background:rgba(0,0,0,.45); padding:7px 12px; border-radius:999px;
    font-size:12px; opacity:.75;
  }
  @media (max-width:600px) {
    .nav { width:42px; height:58px; font-size:27px; }
    #prev { left:8px; } #next { right:8px; }
  }
</style>
</head>
<body>
<div id="deck">
      <section class="slide" id="slide-1" aria-label="Slide 1">
        <img src="slides/slide-1.png" alt="Slide 1" draggable="false">
      </section>
      <section class="slide" id="slide-2" aria-label="Slide 2">
        <img src="slides/slide-2.png" alt="Slide 2" draggable="false">
      </section>
      <section class="slide" id="slide-3" aria-label="Slide 3">
        <img src="slides/slide-3.png" alt="Slide 3" draggable="false">
      </section>
      <section class="slide" id="slide-4" aria-label="Slide 4">
        <img src="slides/slide-4.png" alt="Slide 4" draggable="false">
      </section>
      <section class="slide" id="slide-5" aria-label="Slide 5">
        <img src="slides/slide-5.png" alt="Slide 5" draggable="false">
      </section>
      <section class="slide" id="slide-6" aria-label="Slide 6">
        <img src="slides/slide-6.png" alt="Slide 6" draggable="false">
      </section>
      <section class="slide" id="slide-7" aria-label="Slide 7">
        <img src="slides/slide-7.png" alt="Slide 7" draggable="false">
      </section>
      <section class="slide" id="slide-8" aria-label="Slide 8">
        <img src="slides/slide-8.png" alt="Slide 8" draggable="false">
      </section>
      <section class="slide" id="slide-9" aria-label="Slide 9">
        <img src="slides/slide-9.png" alt="Slide 9" draggable="false">
      </section>
      <section class="slide" id="slide-10" aria-label="Slide 10">
        <img src="slides/slide-10.png" alt="Slide 10" draggable="false">
      </section>
      <section class="slide" id="slide-11" aria-label="Slide 11">
        <img src="slides/slide-11.png" alt="Slide 11" draggable="false">
      </section>
      <section class="slide" id="slide-12" aria-label="Slide 12">
        <img src="slides/slide-12.png" alt="Slide 12" draggable="false">
      </section>
      <section class="slide" id="slide-13" aria-label="Slide 13">
        <img src="slides/slide-13.png" alt="Slide 13" draggable="false">
      </section>
      <section class="slide" id="slide-14" aria-label="Slide 14">
        <img src="slides/slide-14.png" alt="Slide 14" draggable="false">
      </section>
      <section class="slide" id="slide-15" aria-label="Slide 15">
        <img src="slides/slide-15.png" alt="Slide 15" draggable="false">
      </section>
      <section class="slide" id="slide-16" aria-label="Slide 16">
        <img src="slides/slide-16.png" alt="Slide 16" draggable="false">
      </section>
      <section class="slide" id="slide-17" aria-label="Slide 17">
        <img src="slides/slide-17.png" alt="Slide 17" draggable="false">
      </section>
</div>
<button class="nav" id="prev" aria-label="Previous slide">‹</button>
<button class="nav" id="next" aria-label="Next slide">›</button>
<div id="hint">Use ← → or click the arrows</div>
<div id="counter">1 / 17</div>

<script>
const slides = [...document.querySelectorAll('.slide')];
const counter = document.getElementById('counter');
let current = 0;

function showSlide(index) {
  current = Math.max(0, Math.min(index, slides.length - 1));
  slides.forEach((s, i) => s.classList.toggle('active', i === current));
  counter.textContent = `${current + 1} / ${slides.length}`;
  history.replaceState(null, '', `#slide-${current + 1}`);
}

document.getElementById('prev').onclick = () => showSlide(current - 1);
document.getElementById('next').onclick = () => showSlide(current + 1);

document.addEventListener('keydown', e => {
  if (['ArrowRight','PageDown',' '].includes(e.key)) {
    e.preventDefault(); showSlide(current + 1);
  } else if (['ArrowLeft','PageUp'].includes(e.key)) {
    e.preventDefault(); showSlide(current - 1);
  } else if (e.key === 'Home') {
    showSlide(0);
  } else if (e.key === 'End') {
    showSlide(slides.length - 1);
  } else if (e.key === 'Escape') {
    document.documentElement.requestFullscreen?.();
  }
});

let startX = null;
document.addEventListener('touchstart', e => startX = e.changedTouches[0].clientX, {passive:true});
document.addEventListener('touchend', e => {
  if (startX === null) return;
  const dx = e.changedTouches[0].clientX - startX;
  if (Math.abs(dx) > 50) showSlide(current + (dx < 0 ? 1 : -1));
  startX = null;
}, {passive:true});

const hashMatch = location.hash.match(/slide-(\d+)/);
showSlide(hashMatch ? Number(hashMatch[1]) - 1 : 0);
</script>
</body>
</html>
